project:
  type: book
  post-render: post-render.R
  resources:
    - gifs/*.mp4
    - data/*.txt

book:
  title: "That's weird! Anomaly&nbsp;detection using&nbsp;R"
  author:
    name: "<a href='https://robjhyndman.com'>Rob J Hyndman</a>"
    affiliation: "Monash University, Australia"
  site-url: "https://OTexts.com/weird"
  chapters:
    - index.qmd
    - "intro.qmd"
    - "univariate.qmd"
    - "multivariate.qmd"
    - "tests.qmd"
    - "boxplots.qmd"
    - "distance.qmd"
    - "density.qmd"
    - "regression.qmd"
    - "highdim.qmd"
    - "text.qmd"
    - "timeseries.qmd"
    - "functional.qmd"
    - "imagevideo.qmd"
    - "distributions.qmd"
    - "network.qmd"
    - "events.qmd"
    - "references.qmd"
  appendices:
    - "appendix.qmd"
  page-footer:
    left: "Published by OTexts using [Quarto](https://quarto.org). &copy; [Rob J Hyndman](https://robjhyndman.com) []{#current-year}"
    border: false
    background: light
  sidebar:
    id: book
    background: "#cccccc"
    style: "docked"
  favicon: favicon.ico

bibliography: weird.bib

execute:
  freeze: auto
  cache: true

format:
  otexts-html:
    code-fold: true
