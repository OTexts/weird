project:
  type: book
  resources:
    - gifs/*.mp4
    - data/*.txt

book:
  title: "That's weird! Anomaly&nbsp;detection using&nbsp;R"
  author:
    name: "<a href='https://robjhyndman.com'>Rob J Hyndman</a>"
    affiliation: "Monash University, Australia"
  site-url: "https://OTexts.com/weird"
  chapters:
    - index.qmd
    - "intro.qmd"
    - "univariate.qmd"
    - "multivariate.qmd"
    - "tests.qmd"
    - "boxplots.qmd"
    - "distance.qmd"
    - "density.qmd"
    - "regression.qmd"
    - "highdim.qmd"
    - "timeseries.qmd"
    - "functional.qmd"
    - "network.qmd"
    - "imagevideo.qmd"
    - "text.qmd"
    - "distributions.qmd"
    - "events.qmd"
    - "references.qmd"
  appendices:
    - "appendix.qmd"
  page-footer:
    left: "Published by OTexts using [Quarto](https://quarto.org). &copy; [Rob J Hyndman](https://robjhyndman.com) []{#current-year}"
    border: false
    background: light
  sidebar:
    background: "#cccccc"
    style: "docked"
  favicon: "https://otexts.com/favicon.ico"

published-title: "Last updated"
date-format: "DD MMMM YYYY"
number-depth: 2
bibliography: weird.bib
biblio-style: authoryear-comp
fig-width: 8
fig-height: 5
fig-align: center
fig-dpi: 150
output-width: 100%
syntax-highlighting: kate

execute:
  freeze: auto
  collapse: true
  echo: true
  cache: true

format:
  html:
    theme:
      light:
        - cosmo
        - otexts.scss
    toc-title: "Sections"
    fontsize: 1rem
    linestretch: 1.5
    mainfont: "Libron, Georgia, serif"
    html-math-method: katex
    code-link: false
    fig-responsive: true
    code-fold: true
    embed-resources: false
    include-in-header:
      - file: goatcounter.html
    include-after-body:
      - text: |
          <script>
            document.getElementById('current-year').textContent = new Date().getFullYear();
          </script>
    csl: apa-single-spaced.csl
