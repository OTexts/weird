<header id="title-block-header" class="quarto-title-block default$if(otexts-byline)$ otexts-title-block$endif$">
<div class="quarto-title">
$if(title)$
<h1 class="title">$title$$if(subtitle)$ <small class="subtitle">$subtitle$</small>$endif$</h1>
$endif$
</div>
$if(otexts-byline)$
<div class="otexts-title-authors">
<p class="author">$otexts-byline$</p>
$if(otexts-affiliations)$
<p class="affiliation">$otexts-affiliations$</p>
$endif$
</div>
$else$

$title-metadata.html()$

$endif$
</header>
