title: OTexts
author: Rob J Hyndman
version: 0.1.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    html:
      theme:
        light:
          - cosmo
          - otexts.scss
      toc-title: "Sections"
      fontsize: 1.125rem
      linestretch: 1.6
      mainfont: "Libron, Georgia, serif"
      html-math-method: katex
      syntax-highlighting: kate
      number-depth: 2
      code-link: false
      fig-responsive: true
      # Figure defaults for R books (fig-dpi is doubled for retina screens)
      fig-width: 7.5
      fig-asp: 0.618
      fig-dpi: 150
      fig-align: center
      knitr:
        opts_chunk:
          dev: ragg_png
          fig.align: center # fig-align alone doesn't reach knitr chunks
          out.width: "100%"
          out.extra: 'loading="lazy"'
          comment: ""
      published-title: "Last updated"
      date-format: "DD MMMM YYYY"
      csl: apa-single-spaced.csl
      include-in-header:
        - file: goatcounter.html
      include-after-body:
        - file: current-year.html
        - file: current-date.html
        - file: fit-tables.html
      filters:
        - otexts.lua
    pdf:
      template-partials:
        - before-title.tex
      documentclass: book
      pdf-engine: lualatex
      # Kp text and maths (the OpenType kpfonts, from kpfonts-otf), Fira Sans
      # and Hack as in the HTML. Hack is not in TeX Live: it is in fonts/, and
      # otexts.lua adds its Path. Options are strings so a book's own options
      # replace them
      mainfont: KpRoman-Regular.otf
      mainfontoptions: "BoldFont=KpRoman-Bold.otf, ItalicFont=KpRoman-Italic.otf, BoldItalicFont=KpRoman-BoldItalic.otf"
      sansfont: FiraSans-Regular.otf
      sansfontoptions: "BoldFont=FiraSans-Bold.otf, ItalicFont=FiraSans-Italic.otf, BoldItalicFont=FiraSans-BoldItalic.otf"
      monofont: Hack-Regular.ttf
      monofontoptions: "BoldFont=Hack-Bold.ttf, ItalicFont=Hack-Italic.ttf, BoldItalicFont=Hack-BoldItalic.ttf, Scale=0.86"
      mathfont: KpMath-Regular.otf
      block-headings: false
      cite-method: biblatex
      biblatexoptions:
        - style=authoryear-comp
      number-sections: true
      number-depth: 2
      toc-depth: 2
      toc-title: "Contents"
      linestretch: 1.2
      colorlinks: false
      fig-pos: "htbp"
      tbl-pos: "htbp"
      # Figures are drawn near their printed width (130mm text block), so the
      # plot fonts keep their size
      fig-width: 6.5
      fig-height: 4
      # cairo_pdf finds the plot fonts set up by the otexts R package (BookMath)
      # through fontconfig; the default pdf() device can't use them. Plotmath
      # symbols are set in KaTeX_Main, as they are in the HTML (ragg) figures
      knitr:
        opts_chunk:
          dev: cairo_pdf
          dev.args:
            cairo_pdf:
              symbolfamily: KaTeX_Main_Plot
      geometry: "left=2cm, right=2cm, top=2cm, bottom=2cm"
      include-in-header:
        - file: preamble.tex
      include-after-body:
        - file: printindex.tex
      format-resources:
        - fpp.sty
        - OTexts-graylogo.pdf
      default-image-extension: pdf
      keep-tex: true
      filters:
        - otexts.lua
        - code-blocks.lua
        - at: post-render
          path: tables.lua
